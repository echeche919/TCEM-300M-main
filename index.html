<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Aplicacion de Tremor Bench</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">

</head>

<body>
  <header>
    <div class="d-flex align-items-center">

      <img src="logo.ico" alt="Tromer Logo" style="height: 50px; width: auto;" />

      <div style="width: 50px;"></div>
  </header>

  <div class="d-flex justify-content-center my-3">
    <button id="Datos" class="btn btn-success btn-sm" disabled>
      Iniciar transmisión desde ESP
    </button>
  </div>
  <button id="A">ASKDJASH</button>
  <div class="position-absolute top-0 end-0 m-3">
    <span id="port" class="badge bg-warning text-dark p-2 fs-6"><span class="spinner-border spinner-border-sm me-2"
        role="status" aria-hidden="true"></span>
      Buscando Esp32...
    </span>
  </div>

  <div class="row align-items-center">
    <div class="col">
      <canvas id="myChart" width="50%" height="30%"></canvas>
      <canvas id="myChart2" width="50%" height="30%"></canvas>
      <canvas id="myChart3" width="50%" height="30%"></canvas>
      <canvas id="myChart4" width="50%" height="30%"></canvas>
      <canvas id="myChart5" width="50%" height="30%"></canvas>
      <canvas id="myChart6" width="50%" height="30%"></canvas>
    </div>
    <div class="col">
      <canvas id="myChart7" width="50%" height="30%"></canvas>
      <canvas id="myChart8" width="50%" height="30%"></canvas>
      <canvas id="myChart9" width="50%" height="30%"></canvas>
      <canvas id="myChart10" width="50%" height="30%"></canvas>
      <canvas id="myChart11" width="50%" height="30%"></canvas>
      <canvas id="myChart12" width="50%" height="30%"></canvas>
    </div>
    <hr>
  </div>
  </div>
  </div>

  <div class="position-fixed bottom-0 start-0 m-3" style="z-index: 1050;">
    <button id="Modo Oscuro" class="btn btn-outline-secondary btn-sm">
      <span id="icono-modo">🌙</span>
      <span id="texto-modo">Modo Oscuro</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./renderer.js"></script>
</body>

</html>
