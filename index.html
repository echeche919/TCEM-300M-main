<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Gráfico Frecuencias</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">

</head>

<body>
  <header>
    <div class="d-flex align-items-center">

      <img id="logoTCEM" src="Portada TCEM.png" alt="TCEM Logo" style="height: 50px; width: auto;" />

      <div style="width: 50px;"></div>
  </header>

  <div class="d-flex justify-content-center my-3">
    <button id="Datos" class="btn btn-success btn-sm" disabled>
      Iniciar transmisión desde ESP
    </button>
  </div>

  <div class="position-absolute top-0 end-0 m-3">
    <span id="port" class="badge bg-warning text-dark p-2 fs-6"><span class="spinner-border spinner-border-sm me-2"
        role="status" aria-hidden="true"></span>
      Buscando TCEM 300M...
    </span>
  </div>

  <div class="row align-items-center">
    <div class="col">
      <canvas id="myChart" width="100%" height="20%"></canvas>
      <canvas id="myChart2" width="100%" height="20%"></canvas>
      <canvas id="myChart3" width="100%" height="20%"></canvas>
    </div>
    <div class="col">
      <canvas id="myChart4" width="100%" height="20%"></canvas>
      <canvas id="myChart5" width="100%" height="20%"></canvas>
      <canvas id="myChart6" width="100%" height="20%"></canvas>
    </div>



    <div class="d-flex justify-content-center">
      <button id="btnGraficarTabla1" class="btn btn-success" disabled>
        Graficar
      </button>
    </div>
    <div class="row mt-5">
      <div class="d-inline-flex p-2 bd-highlight">
        <table id="tablaValores1" class="table">
          <thead class="table-dark">
            <tr>
              <th style="width: 50%;">Bandas</th>
              <th style="width: 50%;">Valor [V/M]</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <table id="tablaValores2" class="table">
          <thead class="table-dark">
            <tr>
              <th style="width: 50%;">Bandas</th>
              <th style="width: 50%;">Valor [V/M]</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <table id="tablaValores3" class="table">
          <thead class="table-dark">
            <tr>
              <th style="width: 50%;">Bandas</th>
              <th style="width: 50%;">Valor [V/M]</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <table id="tablaValores4" class="table">
          <thead class="table-dark">
            <tr>
              <th style="width: 50%;">Bandas</th>
              <th style="width: 50%;">Valor [V/M]</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <table id="tablaValores5" class="table">
          <thead class="table-dark">
            <tr>
              <th style="width: 50%;">Bandas</th>
              <th style="width: 50%;">Valor [V/M]</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <table id="tablaValores6" class="table">
          <thead class="table-dark">
            <tr>
              <th style="width: 50%;">Bandas</th>
              <th style="width: 50%;">Valor [V/M]</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  </div>

  <div class="position-fixed bottom-0 start-0 m-3" style="z-index: 1050;">
    <button id="Modo Oscuro" class="btn btn-outline-secondary btn-sm">
      <span id="icono-modo">🌙</span>
      <span id="texto-modo">Modo Oscuro</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./renderer.js"></script>
</body>

</html>
